<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIP Compressor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4338ca;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #374151;
  --muted: #6b7280;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(0,0,0,0.06);
  --transition: .25s ease;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

body {
  background: var(--bg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--text);
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 700px;
}

h1 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
  text-align:center;
}

p.subtitle {
  color: var(--muted);
  font-size: 14px;
  text-align: center;
  margin-bottom: 24px;
}

.drop-zone {
  border: 2px dashed var(--border);
  background: var(--card);
  border-radius: var(--radius);
  padding: 36px 20px;
  text-align: center;
  transition: var(--transition);
  cursor: pointer;
}

.drop-zone:hover {
  border-color: var(--primary-light);
  background: #ffffff;
}

.drop-zone.drag {
  border-color: var(--primary);
  background: rgba(99,102,241,0.06);
  transform: scale(1.01);
}

.drop-zone i {
  font-size: 42px;
  color: var(--primary);
  margin-bottom: 12px;
}

.drop-zone p {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 12px;
}

button {
  border: none;
  cursor: pointer;
  border-radius: var(--radius);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  transition: var(--transition);
}

button.primary {
  background: var(--primary);
  color: white;
}

button.primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
}

button.secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

button.secondary:hover {
  background: var(--bg);
}

.file-list {
  margin-top: 20px;
  display: none;
  flex-direction: column;
  gap: 10px;
}

.file-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
}

.file-info {
  display: flex;
  flex-direction: column;
}

.file-info span {
  font-size: 14px;
}

.file-size {
  color: var(--muted);
  font-size: 12px;
}

.remove {
  color: #ef4444;
  cursor: pointer;
  font-size: 16px;
}

.actions {
  display: none;
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  gap:10px;
}

.total {
  color: var(--text);
  font-size: 14px;
}

.progress-area {
  margin-top: 20px;
  display: none;
}

.bar-bg {
  background: var(--border);
  height: 8px;
  border-radius: 8px;
  overflow: hidden;
}

.bar-fill {
  background: var(--primary);
  width: 0%;
  height: 100%;
  transition: width .3s ease;
}

.percent-text {
  font-size: 14px;
  margin-top: 6px;
  text-align: right;
  color: var(--primary-dark);
}

.result {
  display: none;
  text-align: center;
  margin-top: 20px;
  padding: 20px;
  background: var(--card);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
}

.result h3 {
  margin-bottom: 6px;
  font-size: 20px;
}

.download-area {
  margin-top: 14px;
  display: flex;
  gap:10px;
  justify-content:center;
}

@media (max-width: 600px) {
  .actions { flex-direction: column; }
  .download-area { flex-direction: column; }
  button { width:100%; }
}
</style>
</head>

<body>

<div class="container">

  <h1>ZIP Compressor</h1>
  <p class="subtitle">Kompres file jadi ZIP langsung di browser</p>

  <div id="dropZone" class="drop-zone">
    <i class="fa-solid fa-cloud-arrow-up"></i>
    <p>Seret file ke sini atau klik untuk memilih</p>
    <button id="selectBtn" class="secondary">Pilih File</button>
    <input type="file" id="fileInput" multiple hidden>
  </div>

  <div id="fileList" class="file-list"></div>

  <div id="actions" class="actions">
    <div id="total" class="total"></div>
    <button id="compressBtn" class="primary">Kompres ZIP</button>
  </div>

  <div id="progressArea" class="progress-area">
    <div class="bar-bg"><div id="barFill" class="bar-fill"></div></div>
    <div id="percentText" class="percent-text">0%</div>
  </div>

  <div id="result" class="result">
    <h3>Berhasil!</h3>
    <p id="zipSize"></p>
    <div class="download-area">
      <button id="downloadBtn" class="primary">Download ZIP</button>
      <button id="newBtn" class="secondary">Baru</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const fileList = document.getElementById('fileList');
const actions = document.getElementById('actions');
const total = document.getElementById('total');
const compressBtn = document.getElementById('compressBtn');
const progressArea = document.getElementById('progressArea');
const barFill = document.getElementById('barFill');
const percentText = document.getElementById('percentText');
const result = document.getElementById('result');
const zipSize = document.getElementById('zipSize');
const downloadBtn = document.getElementById('downloadBtn');
const newBtn = document.getElementById('newBtn');

let files = [];
let zipBlob = null;

function formatSize(bytes) {
  const k = 1024;
  const sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes)/Math.log(k));
  return (bytes/Math.pow(k,i)).toFixed(2) + ' ' + sizes[i];
}

function updateUI() {
  fileList.innerHTML = '';
  if (files.length === 0) {
    fileList.style.display = 'none';
    actions.style.display = 'none';
    return;
  }

  fileList.style.display = 'flex';
  actions.style.display = 'flex';

  let sizeSum = 0;
  files.forEach((f,i)=>{
    sizeSum += f.size;
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `
      <div class="file-info">
        <span>${f.name}</span>
        <span class="file-size">${formatSize(f.size)}</span>
      </div>
      <i class="fa-solid fa-xmark remove" data-i="${i}"></i>
    `;
    fileList.appendChild(div);
  });

  total.textContent = `Total: ${formatSize(sizeSum)}`;

  document.querySelectorAll('.remove').forEach(x=>{
    x.onclick = () => {
      files.splice(x.dataset.i,1);
      updateUI();
    }
  });
}

selectBtn.onclick = () => fileInput.click();
dropZone.onclick = (e)=>{ if(e.target === dropZone) fileInput.click(); }

fileInput.onchange = (e) => {
  files.push(...e.target.files);
  updateUI();
}

dropZone.ondragover = (e)=>{
  e.preventDefault();
  dropZone.classList.add('drag');
}
dropZone.ondragleave = ()=>{
  dropZone.classList.remove('drag');
}
dropZone.ondrop = (e)=>{
  e.preventDefault();
  dropZone.classList.remove('drag');
  files.push(...e.dataTransfer.files);
  updateUI();
}

compressBtn.onclick = async () => {
  if (!files.length) return;

  progressArea.style.display = 'block';
  result.style.display = 'none';
  barFill.style.width = '0%';
  percentText.textContent = '0%';

  const zip = new JSZip();
  for (let i=0; i<files.length; i++) {
    const f = files[i];
    zip.file(f.name, f);
    let progress = Math.round(((i+1)/files.length)*100);
    barFill.style.width = progress + '%';
    percentText.textContent = progress + '%';
    await new Promise(r=>setTimeout(r,50));
  }

  zipBlob = await zip.generateAsync({type:"blob"});
  progressArea.style.display = 'none';
  result.style.display = 'block';
  zipSize.textContent = `Ukuran ZIP: ${formatSize(zipBlob.size)}`;
};

downloadBtn.onclick = ()=>{
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = 'compressed.zip';
  a.click();
};

newBtn.onclick = ()=>{
  files = [];
  zipBlob = null;
  updateUI();
  result.style.display = 'none';
  progressArea.style.display = 'none';
}
</script>
</body>
</html>
